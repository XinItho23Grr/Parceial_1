<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión - NIKA PRO</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <!-- Header estándar -->
  <header>
    <div class="header-top">
      <a href="../index.html" class="logo-container">
        <div class="logo-img-wrapper">
          <img src="../img/logo/logo.png" alt="NIKA PRO Logo" onerror="this.src='https://via.placeholder.com/45'">
        </div>
        <span class="logo-title">NIKA PRO</span>
      </a>

      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar productos...">
        <div id="searchDropdown" class="search-dropdown"></div>
      </div>

      <a href="pages/carrito.html" style="color: var(--accent-silver); text-decoration: none; font-weight: bold;">
        🛒 Cart (<span id="cartCount">0</span>)
      </a>
    </div>

   <nav class="nav-bar">
  <!-- Grupo de navegación principal (Izquierda) -->
  <div class="nav-main-links">
    <a href="index.html">Home</a> <span class="separator">|</span>
    <a href="pages/productos.html">Productos</a> <span class="separator">|</span>
    <a href="pages/nosotros.html">Nosotros</a> <span class="separator">|</span>
    <a href="pages/blogs.html">Blogs</a> <span class="separator">|</span>
    <a href="pages/contacto.html">Contacto</a>
  </div>

  <!-- Grupo de inicio de sesión (Extremo Derecho) -->
  <div class="user-auth-links">
    <a href="pages/registro.html">Registrar</a>
  </div>
</nav>
  </header>

  <!-- Contenido principal basado en el Mockup de Login -->
  <main class="login-wrapper">
    
    <!-- Imagen / Placeholder superior del Mockup -->
    <div class="brand-hero-logo">
      <img src="../img/logo/logo.png" alt="Logo Empresa" onerror="this.src='https://via.placeholder.com/150x80?text=LOGO'">
    </div>

    <!-- Nombre de la Empresa -->
    <h1 class="brand-hero-title">NIKA PRO</h1>

    <!-- Tarjeta Formulario de Login -->
    <div class="form-box login-box">
      <div class="form-title-badge">Inicio de sesión</div>

      <form id="loginForm">
        <div class="form-group">
          <label>CORREO</label>
          <input type="email" class="form-control" required placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
          <label>CONTRASEÑA</label>
          <input type="password" class="form-control" required placeholder="••••••••">
        </div>

        <div style="text-align: center; margin-top: 25px;">
          <button type="submit" class="btn btn-login-center">Iniciar sesión</button>
        </div>

        
      </form>
    </div>

  </main>

  <!-- Modal para avisos -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
      <h3 id="modalTitle" class="modal-title"></h3>
      <p id="modalMessage" class="modal-message"></p>
      <button id="modalClose" class="btn">Cerrar</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 NIKA PRO. Todos los derechos reservados.</p>
  </footer>

  <script src="../app.js"></script>
</body>
</html>
