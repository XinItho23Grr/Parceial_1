<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuario - NIKA PRO</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <!-- Header estándar -->
  <header>
    <div class="header-top">
      <a href="../index.html" class="logo-container">
        <div class="logo-img-wrapper">
          <img src="../img/logo/logo.png" alt="NIKA PRO Logo" onerror="this.src='https://via.placeholder.com/45'">
        </div>
        <span class="logo-title">NIKA PRO</span>
      </a>

      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar productos...">
        <div id="searchDropdown" class="search-dropdown"></div>


<nav class="nav-bar">
  <!-- Enlaces principales a la izquierda -->
  <div class="nav-main-links">
    <a href="../index.html">Home</a> <span class="separator">|</span>
    <a href="productos.html">Productos</a> <span class="separator">|</span>
    <a href="nosotros.html">Nosotros</a> <span class="separator">|</span>
    <a href="blogs.html">Blogs</a> <span class="separator">|</span>
    <a href="contacto.html">Contacto</a>
  </div>

  <!-- Iniciar sesión / Registrar en el extremo derecho -->
  <div class="user-auth-links">
    <a href="login.html">Iniciar sesión</a> <span class="separator">|</span>
  </div>
</nav>
  </header>

  <!-- Formulario basado en el Mockup -->
  <main>
    <div class="form-box register-box">
    

      <form id="registerForm">
        <div class="form-group">
          <label>NOMBRE COMPLETO</label>
          <input type="text" class="form-control" required>
        </div>

        <div class="form-group">
          <label>CORREO</label>
          <input type="email" class="form-control" required>
        </div>

        <div class="form-group">
          <label>CONFIRMAR CORREO</label>
          <input type="email" class="form-control" required>
        </div>

        <div class="form-group">
          <label>CONTRASEÑA</label>
          <input type="password" class="form-control" required>
        </div>

        <div class="form-group">
          <label>CONFIRMAR CONTRASEÑA</label>
          <input type="password" class="form-control" required>
        </div>

        <div class="form-group">
          <label>TELÉFONO (opcional)</label>
          <input type="tel" class="form-control">
        </div>

        <!-- Fila doble para Selección de Región y Comuna -->
        <div class="form-row-double">
          <div class="form-group">
            <select class="form-control">
              <option value="">-- Seleccione la región --</option>
              <option value="metropolitana">Región Metropolitana de Santiago</option>
              <option value="araucania">Región de la Araucanía</option>
              <option value="nuble">Región de Ñuble</option>
            </select>
          </div>

          <div class="form-group">
            <select class="form-control">
              <option value="">-- Seleccione la comuna --</option>
              <option value="linares">Linares</option>
              <option value="longavi">Longaví</option>
              <option value="concepcion">Concepción</option>
            </select>
          </div>
        </div>

        <div style="text-align: center; margin-top: 25px;">
          <button type="submit" class="btn" style="min-width: 160px;">REGISTRAR</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Modal para avisos -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
      <h3 id="modalTitle" class="modal-title"></h3>
      <p id="modalMessage" class="modal-message"></p>
      <button id="modalClose" class="btn">Cerrar</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 NIKA PRO. Todos los derechos reservados.</p>
  </footer>

  <script src="../app.js"></script>
</body>
</html>
