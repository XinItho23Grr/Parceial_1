    <div id="productDetailContainer" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 30px; display: flex; gap: 30px; box-shadow: var(--shadow-sm);">
      <div style="width: 48%;">

      <div style="width: 52%;">
        <h2 id="detailTitle" style="color: var(--accent-silver); margin-bottom: 10px;">Cargando...</h2>

        <h4 style="color: var(--accent-silver); margin-bottom: 10px;">Especificaciones Técnicas:</h4>
