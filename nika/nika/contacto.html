<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Nombre Empresa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CABECERA SUPERIOR -->
  <header>
    <div class="header-top">
      <a href="../nika/index.html" class="logo-container">
        <div class="logo-img-wrapper">
          <img src="img/logo/logo.png" alt="Logo">
        </div>
        <span class="logo-title">Site Name</span>
      </a>

      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar productos...">
        <div id="searchDropdown" class="search-dropdown"></div>
      </div>

      <a href="carrito.html" style="color: var(--accent-silver); text-decoration: none; font-weight: bold;">
        🛒 Cart (<span id="cartCount">0</span>)
      </a>
    </div>

   <nav class="nav-bar">
  <!-- Enlaces principales a la izquierda -->
  <div class="nav-main-links">
    <a href="../nika/index.html">Home</a> <span class="separator">|</span>
    <a href="productos.html">Productos</a> <span class="separator">|</span>
    <a href="nosotros.html">Nosotros</a> <span class="separator">|</span>
    <a href="blogs.html">Blogs</a> <span class="separator">|</span>
    <a href="contacto.html">Contacto</a>
  </div>

  <!-- Iniciar sesión / Registrar en el extremo derecho -->
  <div class="user-auth-links">
    <a href="login.html">Iniciar sesión</a> <span class="separator">|</span>
    <a href="registro.html">Registrar</a>
  </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="login-wrapper">

    <!-- Logo / Marca sobre el formulario -->
    <div class="brand-hero-logo">
      <img src="img/logo/logo.png" alt="Logo Empresa">
    </div>
    <h2 class="brand-hero-title">Nika Pro</h2>

    <!-- Caja del Formulario de Contacto -->
    <div class="form-box">
      <div class="form-title-badge">
        FORMULARIO DE CONTACTOS
      </div>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="contenido">Contenido</label>
          <textarea id="contenido" name="contenido" class="form-control" rows="4" required></textarea>
        </div>

        <div style="text-align: center; margin-top: 20px;">
          <button type="submit" class="btn btn-login-center">ENVIAR MENSAJE</button>
        </div>
      </form>
    </div>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p>&copy; 2026 Nombre Empresa. Todos los derechos reservados.</p>
  </footer>
    <script src="app.js"></script>
</body>
</html>
